<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS-only responsive gallery</title>
<style>
  :root{
    --bg:#111318;
    --panel:#1b1e26;
    --text:#e9ebf0;
    --muted:#8a90a2;
    --gap:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
    padding:24px;
  }
  h1{font-size:1.1rem; font-weight:600; margin:0 0 4px;}
  p.note{color:var(--muted); font-size:.85rem; margin:0 0 20px;}

  /* ---------- GRID ---------- */
  .gallery{
    display:grid;
    gap:var(--gap);
    grid-template-columns:repeat(1,1fr); /* phone default: 1 */
  }
  .thumb{
    position:relative;
    display:block;
    aspect-ratio:1/1;         /* forces every tile to the same square size */
    overflow:hidden;
    border-radius:6px;
    background:var(--panel);
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;         /* crops instead of squishing */
    display:block;
    transition:transform .25s ease;
  }
  .thumb:hover img{ transform:scale(1.06); }

  /* Tablet: 3–4 columns */
  @media (min-width:600px){
    .gallery{ grid-template-columns:repeat(3,1fr); }
  }
  @media (min-width:760px){
    .gallery{ grid-template-columns:repeat(4,1fr); }
  }
  /* Desktop: 5 columns */
  @media (min-width:1000px){
    .gallery{ grid-template-columns:repeat(5,1fr); }
  }
  /* Large / TV: 6–7 columns */
  @media (min-width:1500px){
    .gallery{ grid-template-columns:repeat(6,1fr); }
  }
  @media (min-width:1900px){
    .gallery{ grid-template-columns:repeat(7,1fr); }
  }

  /* ---------- LIGHTBOX (pure CSS, uses :target) ---------- */
  .lightbox{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,.92);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:5vh 5vw;
  }
  .lightbox:target{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:4px;
  }
  .lightbox .close{
    position:absolute;
    top:18px; right:26px;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:1.6rem;
    text-decoration:none;
    background:rgba(255,255,255,.08);
    border-radius:50%;
  }
  .lightbox .close:hover{ background:rgba(255,255,255,.18); }
</style>
</head>
<body>
